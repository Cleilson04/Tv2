name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip KickTV.zip
      - run: |
          echo "android.useAndroidX=true" > KickTV/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> KickTV/gradle.properties
      - run: cd KickTV && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KickTV-apk
          path: KickTV/app/build/outputs/apk/debug/app-debug.apk
